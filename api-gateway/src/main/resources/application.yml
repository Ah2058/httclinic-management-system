spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
        - id: submit-service
          uri: ${SUBMIT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/submit/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
              - http://localhost:4300
              - http://frontend:4200
              - https://frontend-production-a054.up.railway.app
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - '*'
            allowCredentials: true
            maxAge: 3600

server:
  port: 8888
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG