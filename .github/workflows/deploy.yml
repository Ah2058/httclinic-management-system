name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ah2058 --password-stdin

      - name: Build and Push auth-service
        run: |
          docker build -t ghcr.io/ah2058/auth-service:latest auth-service
          docker push ghcr.io/ah2058/auth-service:latest

      - name: Build and Push submit-service
        run: |
          docker build -t ghcr.io/ah2058/submit-service:latest submit-service/submit-service
          docker push ghcr.io/ah2058/submit-service:latest

      - name: Build and Push api-gateway
        run: |
          docker build -t ghcr.io/ah2058/api-gateway:latest api-gateway
          docker push ghcr.io/ah2058/api-gateway:latest

      - name: Build and Push frontend
        run: |
          docker build -t ghcr.io/ah2058/frontend:latest frontend
          docker push ghcr.io/ah2058/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy auth-service to Railway
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"89b85f85-f246-4bcd-a5e2-420b44542c89\", input: { source: { image: \"ghcr.io/ah2058/auth-service:latest\" } }) { id } }"}'
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"89b85f85-f246-4bcd-a5e2-420b44542c89\") }"}'

      - name: Deploy submit-service to Railway
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"57262734-3750-4948-8b94-35a906e155d4\", input: { source: { image: \"ghcr.io/ah2058/submit-service:latest\" } }) { id } }"}'
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"57262734-3750-4948-8b94-35a906e155d4\") }"}'

      - name: Deploy api-gateway to Railway
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"d2ce2905-6206-4001-a1c7-58bf5587b6ad\", input: { source: { image: \"ghcr.io/ah2058/api-gateway:latest\" } }) { id } }"}'
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"d2ce2905-6206-4001-a1c7-58bf5587b6ad\") }"}'

      - name: Deploy frontend to Railway
        run: |
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceUpdate(serviceId: \"560a7cc1-af92-4d54-918e-c6a92e55501b\", input: { source: { image: \"ghcr.io/ah2058/frontend:latest\" } }) { id } }"}'
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"560a7cc1-af92-4d54-918e-c6a92e55501b\") }"}'
