name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.gitlab.com -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and Push api-gateway
        run: |
          docker build -t registry.gitlab.com/${{ secrets.REGISTRY_IMAGE }}/api-gateway:latest api-gateway
          docker push registry.gitlab.com/${{ secrets.REGISTRY_IMAGE }}/api-gateway:latest

      - name: Build and Push frontend
        run: |
          docker build -t registry.gitlab.com/${{ secrets.REGISTRY_IMAGE }}/frontend:latest frontend
          docker push registry.gitlab.com/${{ secrets.REGISTRY_IMAGE }}/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Railway
        run: |
          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"d2ce2905-6206-4001-a1c7-58bf5587b6ad\") }"}'
          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceDeploy(serviceId: \"560a7cc1-af92-4d54-918e-c6a92e55501b\") }"}'
