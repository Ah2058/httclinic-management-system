stages:
  - test
  - build
  - docker
  - deploy

variables:
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  NODE_ENV: "production"
  DOCKER_DRIVER: "overlay2"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
  API_GATEWAY_IMAGE: "$CI_REGISTRY_IMAGE/api-gateway:$IMAGE_TAG"
  AUTH_SERVICE_IMAGE: "$CI_REGISTRY_IMAGE/auth-service:$IMAGE_TAG"
  SUBMIT_SERVICE_IMAGE: "$CI_REGISTRY_IMAGE/submit-service:$IMAGE_TAG"
  DEPLOY_PATH: "/opt/clinic-management-system"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - m2/repository
    - frontend/node_modules

include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: test

.maven_test_template:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

.maven_build_template:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests

test:auth-service:
  extends: .maven_test_template
  services:
    - name: mariadb:11
      alias: mariadb
  variables:
    SPRING_PROFILES_ACTIVE: "test"
    SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/auth_db"
    SPRING_DATASOURCE_USERNAME: "root"
    SPRING_DATASOURCE_PASSWORD: "root"
    MARIADB_ROOT_PASSWORD: "root"
    MARIADB_DATABASE: "auth_db"
  before_script:
    - until (echo > /dev/tcp/mariadb/3306) 2>/dev/null; do echo "Waiting for MariaDB..."; sleep 2; done
    - cd auth-service

test:submit-service:
  extends: .maven_test_template
  services:
    - name: mariadb:11
      alias: mariadb
  variables:
    SPRING_PROFILES_ACTIVE: "test"
    SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/clinicdb"
    SPRING_DATASOURCE_USERNAME: "root"
    SPRING_DATASOURCE_PASSWORD: "root"
    MARIADB_ROOT_PASSWORD: "root"
    MARIADB_DATABASE: "clinicdb"
  before_script:
    - until (echo > /dev/tcp/mariadb/3306) 2>/dev/null; do echo "Waiting for MariaDB..."; sleep 2; done
    - cd submit-service/submit-service

test:api-gateway:
  extends: .maven_test_template
  before_script:
    - cd api-gateway

build:auth-service:
  extends: .maven_build_template
  before_script:
    - cd auth-service
  artifacts:
    paths:
      - auth-service/target/*.jar
    expire_in: 1 week

build:submit-service:
  extends: .maven_build_template
  before_script:
    - cd submit-service/submit-service
  artifacts:
    paths:
      - submit-service/submit-service/target/*.jar
    expire_in: 1 week

build:api-gateway:
  extends: .maven_build_template
  before_script:
    - cd api-gateway
  artifacts:
    paths:
      - api-gateway/target/*.jar
    expire_in: 1 week

build:frontend:
  stage: build
  image: node:22-bookworm
  variables:
    NODE_ENV: "development"
  before_script:
    - cd frontend
    - npm ci --include=dev
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

docker:build-and-push:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$AUTH_SERVICE_IMAGE" auth-service
    - docker push "$AUTH_SERVICE_IMAGE"
    - docker build -t "$SUBMIT_SERVICE_IMAGE" submit-service/submit-service
    - docker push "$SUBMIT_SERVICE_IMAGE"
    - docker build -t "$API_GATEWAY_IMAGE" api-gateway
    - docker push "$API_GATEWAY_IMAGE"
    - docker build -t "$FRONTEND_IMAGE" frontend
    - docker push "$FRONTEND_IMAGE"
  needs:
    - build:auth-service
    - build:submit-service
    - build:api-gateway
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH

.deploy_template:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl
  script:
   npm install -g railway/cli
   railway login --token "$RAILWAY_TOKEN"
   railway up --project "$RAILWAY_PROJECT_ID" --service "auth-service" --image "$AUTH_SERVICE_IMAGE"
   railway up --project "$RAILWAY_PROJECT_ID" --service "submit-service" --image "$SUBMIT_SERVICE_IMAGE"
   railway up --project "$RAIL        
   WAY_PROJECT_ID" --service "api-gateway" --image "$API_GATEWAY_IMAGE"
   railway up --project "$RAILWAY_PROJECT_ID" --service "frontend" --image "$FRONTEND_IMAGE"


deploy:staging:
  extends: .deploy_template
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:production:
  extends: .deploy_template
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
